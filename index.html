:root{--bg:#121014;--panel:#1d1a20;--line:#322d37;--text:#f3ede7;--muted:#a69fab;--acc:#e5322d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding:12px 16px 28px;display:flex;justify-content:center}
.app{width:100%;max-width:1240px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font:900 28px PF,Georgia,serif;margin:0}
.tip{color:var(--muted);font-size:13px}
.stage{position:relative;width:100%;max-width:max(560px,calc((100vh - 330px)*16/9));margin:0 auto;aspect-ratio:16/9;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.55);background:#000;cursor:text}
canvas{display:block;width:100%;height:100%}
.hint{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);padding:8px 16px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;pointer-events:none;transition:opacity .4s;white-space:nowrap}
.badge{position:absolute;top:12px;left:12px;padding:6px 12px;border-radius:99px;background:rgba(200,20,40,.92);color:#fff;font-size:13px;font-weight:600;display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#txt{flex:1 1 260px;min-width:0;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 16px;font-size:19px;outline:none}
#txt:focus{border-color:#6b6372}
.themes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:820px){.themes{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:96px;overflow-x:auto;padding-bottom:6px}}
.chip{display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:14px;border:2px solid transparent;background:var(--panel);color:var(--text);font-size:12px;cursor:pointer;text-align:center}
.chip .sw{height:56px;border-radius:10px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font:900 28px PF,Georgia,serif}
.chip .d{position:absolute;right:9px;top:7px;width:18px;height:18px;border-radius:50%}
.chip .d2{position:absolute;left:10px;top:12px;width:11px;height:11px;border-radius:50%}
.chip .v{position:absolute;left:8px;right:34px;bottom:8px;height:3px;border-radius:2px}
.chip.on{border-color:var(--text)}
.lbl{color:var(--muted);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{height:44px;min-width:54px;padding:0 14px;background:var(--panel);color:var(--muted);border:0;font-size:15px;cursor:pointer}
.seg button.on{background:var(--text);color:var(--bg);font-weight:600}
.btn{height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px;cursor:pointer}
.btn.on{background:var(--text);color:var(--bg);font-weight:600}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;margin-left:auto;min-width:190px}
button:disabled,input:disabled{opacity:.5;cursor:default}
.msg{color:var(--muted);font-size:14px;min-height:20px}
.msg a{color:var(--text)}
</style>

<body>
<div class="app">
  <header><h1>Цветочные буквы</h1><span class="tip">Нажми на картинку и печатай</span></header>
  <div class="stage" id="stage">
    <canvas id="c" width="1920" height="1080"></canvas>

    <button class="btn" id="clear">Очистить</button>
    <button class="btn main" id="dl">Скачать видео</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
(()=>{
'use strict';
const W=1920,H=1080,REF=200,TAU=Math.PI*2;
let WEIGHT=900;
const fontStr=()=>`${WEIGHT} ${REF}px PF, Georgia, serif`;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const ease=t=>t<=0?0:t>=1?1:1-Math.pow(1-t,3);
const back=t=>{if(t<=0)return 0;if(t>=1)return 1;const c1=1.5,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(a,b,c){let h=2166136261^a;h=Math.imul(h^b,16777619);h=Math.imul(h^c,16777619);return(h^h>>>13)>>>0}
const HX={};
function hex(c){if(HX[c])return HX[c];let s=c.replace('#','');if(s.length===3)s=s.split('').map(x=>x+x).join('');const n=parseInt(s,16);return HX[c]=[n>>16&255,n>>8&255,n&255]}
function mix(a,b,k){const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join('')}
function rgba(c,a){const A=hex(c);return`rgba(${A[0]},${A[1]},${A[2]},${a})`}

/* ---------- темы ---------- */
const THEMES=[
{name:'Алый сад',bg:'#050505',letter:'#f6f1ea',vine:'#2430d8',vineLight:'#6b7cff',
 flowers:[{k:'rose',c:['#e8212c','#ff9a94','#b3121c'],w:1}],bf:[['#ffffff','#cfd6ff'],['#e8e8ff','#9aa6ff']]},
{name:'Бумага',bg:'#eee9dc',letter:'#141414',vine:'#1c2aa8',vineLight:'#5d70e8',
 flowers:[{k:'rose',c:['#ee3a22','#f9c4a4','#bb2412'],w:1}],bf:[['#ee3a22','#1c2aa8'],['#1c2aa8','#ee3a22']]},
{name:'Лимон',bg:'#fbe4a0',letter:'#1a1f14',vine:'#2f7d3a',vineLight:'#7fc46a',
 flowers:[{k:'rose',c:['#e0212f','#ff9a9a','#a9121f'],w:3},{k:'poppy',c:['#f0452a','#ffd2a8','#b3200f'],w:1}],bf:[['#e0212f','#2f7d3a'],['#ffffff','#2f7d3a']]},
{name:'Апельсин',bg:'#050505',letter:'#ffffff',vine:'#2f8f4a',vineLight:'#8fe08a',
 flowers:[{k:'rose',c:['#ff8a1c','#ffd08a','#d9620a'],w:3},{k:'poppy',c:['#ffa63d','#fff0c8','#d9620a'],w:1}],bf:[['#ffb347','#2f8f4a'],['#fff3d6','#ff8a1c']]},
{name:'Белые розы',bg:'#050505',letter:'#f4f4f4',vine:'#8a8a8a',vineLight:'#cfcfcf',
 flowers:[{k:'rose',c:['#f2f2f2','#8c8c8c','#c9c9c9'],w:1}],bf:[['#ffffff','#9a9a9a']]},
{name:'Красный',bg:'#e60000',letter:'#0b0b0b',vine:'#0b0b0b',vineLight:'#3a0000',
 flowers:[{k:'rose',c:['#f6e6d2','#e60000','#e8cdb2'],w:1}],bf:[['#f6e6d2','#0b0b0b']]},
{name:'Тёмный лес',bg:'#173a2a',letter:'#eaf3dc',vine:'#6dd38b',vineLight:'#b7f0c4',
 flowers:[{k:'rose',c:['#ff8fb1','#ffd3e0','#e0527f'],w:3},{k:'daisy',c:['#ffffff','#f7c948','#d8e8d0'],w:1}],bf:[['#ffd3e0','#6dd38b'],['#ffffff','#ff8fb1']]},
{name:'Сакура',bg:'#fde8ee',letter:'#5a2a3c',vine:'#7a4358',vineLight:'#c98aa5',
 flowers:[{k:'sakura',c:['#ff9fbd','#fff0f5','#e0587f'],w:2},{k:'sakura',c:['#ffd0de','#f07fa5','#f5a4bd'],w:2}],bf:[['#ffb3c9','#7a4358'],['#ffffff','#e0587f']]},
{name:'Лаванда',bg:'#e6dcf7',letter:'#2b1b4a',vine:'#3b6b3a',vineLight:'#8fc48a',
 flowers:[{k:'rose',c:['#8e5bd6','#d9c2ff','#6a3cb0'],w:3},{k:'daisy',c:['#ffffff','#f2b84b','#e7dcf7'],w:1}],bf:[['#8e5bd6','#3b6b3a'],['#ffffff','#8e5bd6']]},
{name:'Золото',bg:'#0b0a08',letter:'#f1d58b',frame:'#d9aa43',vine:'#d9aa43',vineLight:'#fff0b8',
 flowers:[{k:'rose',c:['#d9a02e','#fff0c0','#a8741a'],w:1}],bf:[['#f2cf6c','#8a6410'],['#fff6dc','#d9aa43']]}
];
let TH=THEMES[0],THI=0;
const bgC=document.createElement('canvas');bgC.width=W;bgC.height=H;
function paintBg(i){
 const g=bgC.getContext('2d'),t=THEMES[i],R=rng(4242+i);g.setTransform(1,0,0,1,0,0);
 g.fillStyle=t.bg;g.fillRect(0,0,W,H);
 const dark=(hex(t.bg)[0]+hex(t.bg)[1]+hex(t.bg)[2])<300;
 for(let k=0;k<9000;k++){g.fillStyle=dark?`rgba(255,255,255,${R()*.035})`:`rgba(60,40,20,${R()*.05})`;g.fillRect(R()*W,R()*H,1+R()*1.6,1+R()*1.6)}
 const gr=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.75);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,dark?'rgba(0,0,0,.35)':'rgba(70,40,10,.10)');g.fillStyle=gr;g.fillRect(0,0,W,H)}

/* ---------- цветы ---------- */
function blob(c,R,lobes,ph,wob){
 const N=18,P=[];
 for(let i=0;i<N;i++){const th=i/N*TAU,r=R*(1+.09*Math.sin(lobes*th+ph)+.055*Math.sin((lobes+2)*th+ph*1.3)+wob*Math.sin(2*th+ph*2+T*1.6));P.push([Math.cos(th)*r,Math.sin(th)*r])}
 c.beginPath();
 const m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2],s=m(P[N-1],P[0]);c.moveTo(s[0],s[1]);
 for(let i=0;i<N;i++){const q=m(P[i],P[(i+1)%N]);c.quadraticCurveTo(P[i][0],P[i][1],q[0],q[1])}
 c.closePath()}
function spiral(c,rr,o,ph,turns,k){
 c.beginPath();const T1=turns*TAU*o;
 for(let t=0;t<=T1;t+=.18){const r=rr*(.04+k*t/(turns*TAU)),x=Math.cos(t+ph)*r,y=Math.sin(t+ph)*r;t?c.lineTo(x,y):c.moveTo(x,y)}
 c.stroke()}
const PAINT={
 rose(c,R,o,[A,L,S],f){
  const rr=R*(.4+.6*o);
  blob(c,rr,6,f.ph,.012);c.fillStyle=A;c.fill();
  c.save();c.translate(rr*.05,-rr*.04);blob(c,rr*.7,5,f.ph+1,.01);c.fillStyle=mix(A,S,.45);c.fill();c.restore();
  c.save();c.translate(-rr*.04,rr*.03);blob(c,rr*.42,4,f.ph+2,.01);c.fillStyle=A;c.fill();c.restore();
  c.strokeStyle=L;c.lineCap='round';c.lineJoin='round';c.lineWidth=Math.max(1.3,rr*.055);
  const oo=clamp((o-.15)/.85);
  spiral(c,rr,oo,f.ph,2.4,.5);
  for(let i=0;i<3;i++){const a=f.ph+i*2.1;c.beginPath();c.arc(0,0,rr*.78,a,a+.85*oo);c.stroke()}
  for(let i=0;i<2;i++){const a=f.ph*1.7+i*3.3+1;c.beginPath();c.arc(0,0,rr*.58,a,a+.6*oo);c.stroke()}},
 poppy(c,R,o,[A,L,S],f){
  const rr=R*(.4+.6*o);
  for(let i=0;i<5;i++){c.save();c.rotate(f.ph+i*TAU/5);c.translate(rr*.46,0);blob(c,rr*.56,3,f.ph+i,.01);c.fillStyle=i%2?A:mix(A,S,.25);c.fill();c.restore()}
  c.strokeStyle=L;c.lineCap='round';c.lineWidth=Math.max(1.2,rr*.04);
  for(let i=0;i<5;i++){const a=f.ph+i*TAU/5;c.beginPath();c.moveTo(Math.cos(a)*rr*.2,Math.sin(a)*rr*.2);c.lineTo(Math.cos(a)*rr*.75*o,Math.sin(a)*rr*.75*o);c.stroke()}
  c.beginPath();c.arc(0,0,rr*.2,0,TAU);c.fillStyle=S;c.fill();
  for(let i=0;i<8;i++){const a=i/8*TAU;c.beginPath();c.arc(Math.cos(a)*rr*.27,Math.sin(a)*rr*.27,rr*.03,0,TAU);c.fillStyle=L;c.fill()}},
 sakura(c,R,o,[A,L,S],f){
  const rr=R*(.4+.6*o);
  for(let i=0;i<5;i++){c.save();c.rotate(f.ph+i*TAU/5);c.translate(rr*.5,0);blob(c,rr*.5,2,f.ph+i*2,.008);c.fillStyle=i%2?A:mix(A,L,.2);c.fill();
   c.strokeStyle=S;c.lineWidth=Math.max(1.2,rr*.04);c.beginPath();c.moveTo(rr*.12,0);c.lineTo(rr*.42,0);c.stroke();c.restore()}
  c.strokeStyle=S;c.lineWidth=Math.max(1,rr*.03);
  for(let i=0;i<8;i++){const a=f.ph+i/8*TAU,r=rr*.3*o;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*r,Math.sin(a)*r);c.stroke();c.beginPath();c.arc(Math.cos(a)*r,Math.sin(a)*r,rr*.03,0,TAU);c.fillStyle=S;c.fill()}},
 daisy(c,R,o,[A,L,S],f){
  const rr=R*(.4+.6*o);
  for(let i=0;i<14;i++){c.save();c.rotate(f.ph+i*TAU/14);c.beginPath();c.ellipse(rr*.6,0,rr*.4,rr*.13,0,0,TAU);c.fillStyle=A;c.fill();c.strokeStyle=S;c.lineWidth=Math.max(1,rr*.025);c.stroke();c.restore()}
  c.beginPath();c.arc(0,0,rr*.26,0,TAU);c.fillStyle=L;c.fill();
  for(let i=0;i<6;i++){const a=i*2.4,r=rr*.12*Math.sqrt(i/6);c.beginPath();c.arc(Math.cos(a)*r,Math.sin(a)*r,rr*.025,0,TAU);c.fillStyle=mix(L,'#000000',.35);c.fill()}}
};
function bud(c,R,q,A,leaf){
 const k=.4+.6*ease(q),h=R*.7*k,w=R*.33*k;
 c.beginPath();c.moveTo(0,-h);c.bezierCurveTo(w*1.4,-h*.35,w,h*.4,0,h*.45);c.bezierCurveTo(-w,h*.4,-w*1.4,-h*.35,0,-h);c.fillStyle=A;c.fill();
 c.beginPath();c.moveTo(0,h*.55);c.quadraticCurveTo(w*1.4,0,w*.5,-h*.2);c.quadraticCurveTo(w*.3,h*.15,0,h*.15);c.quadraticCurveTo(-w*.3,h*.15,-w*.5,-h*.2);c.quadraticCurveTo(-w*1.4,0,0,h*.55);c.fillStyle=leaf;c.fill()}
function pickF(f){let tot=0;for(const e of TH.flowers)tot+=e.w;let r=f.r*tot;for(const e of TH.flowers){r-=e.w;if(r<=0)return e}return TH.flowers[0]}

/* ---------- лозы ---------- */
function makeVine(R,x0,y0,a0,len,opt){
 const STEP=4,n=Math.round(len/STEP),xs=[x0],ys=[y0],ang=[a0];
 let x=x0,y=y0,a=a0;const f=.07+R()*.07,ph=R()*TAU,amp=.1+R()*.14;
 for(let s=1;s<=n;s++){a+=Math.sin(s*f+ph)*amp*.5+(R()-.5)*.05+(a0-a)*.012;x+=Math.cos(a)*STEP;y+=Math.sin(a)*STEP;xs.push(x);ys.push(y);ang.push(a)}
 const ie=xs.length-1;
 if(opt.curl){const dir=R()<.5?1:-1;let st=STEP*.9;const m=14+((R()*8)|0);for(let j=0;j<m;j++){a+=dir*(.16+j*.035);x+=Math.cos(a)*st;y+=Math.sin(a)*st;st*=.93;xs.push(x);ys.push(y);ang.push(a)}}
 const N=xs.length,leaves=[];let side=R()<.5?1:-1;
 const lsz=opt.small?[11,6]:[16,9];
 for(let i=3;i<N-2;i+=2+((R()*2)|0)){
  side=-side;const k=1-.35*Math.min(1,i/ie);
  leaves.push({i,a:ang[i]+side*(.7+R()*.35),len:(lsz[0]+R()*lsz[1])*k,ph:R()*TAU,c:R()<.35?1:0});
  if(R()<.35)leaves.push({i,a:ang[i]-side*(.7+R()*.35),len:(lsz[0]+R()*lsz[1])*k*.85,ph:R()*TAU,c:R()<.35?1:0})}
 const flowers=[],fl=(i,Rr)=>({i,R:Rr,r:R(),ph:R()*TAU,rot:R()*TAU,dx:(R()-.5)*6,dy:(R()-.5)*6});
 if(opt.flowerEnd)flowers.push(fl(ie,opt.small?18+R()*7:30+R()*16));
 if(opt.mid)flowers.push(fl(Math.max(4,Math.floor(ie*(.4+R()*.2))),24+R()*9));
 flowers.sort((p,q)=>q.R-p.R);
 return{xs:Float32Array.from(xs),ys:Float32Array.from(ys),ang,n:N,ie,leaves,flowers,w0:opt.small?2.4:3.2+R()*.7,delay:0,dur:1}}
function genVines(L,dens){
 const R=rng(hash(sceneSeed,L.idx,L.ch.charCodeAt(0)));L.vines=[];L.sideL=null;L.sideR=null;
 if(!L.pts.length)return;
 const pick=()=>L.pts[(R()*L.pts.length)|0];const nMain=2;
 for(let i=0;i<nMain;i++){
  const up=R()<.62,p=pick(),base=(up?-Math.PI/2:Math.PI/2)+(R()-.5)*1.5,len=90+R()*90;
  const v=makeVine(R,p[0],p[1],base,len,{curl:R()<.55,flowerEnd:R()<.8*dens+.1,mid:R()<.3*dens});
  v.delay=i*.12;if(R()<.15*dens){const k=Math.floor(v.ie*.18);v.flowers.push({i:Math.max(3,k),R:22+R()*10,r:R(),ph:R()*TAU,rot:R()*TAU,dx:0,dy:0})}L.vines.push(v);
  if(R()<.75){const k=Math.floor(v.ie*(.35+R()*.3)),sd=R()<.5?1:-1;
   const tw=makeVine(R,v.xs[k],v.ys[k],v.ang[k]+sd*(.8+R()*.5),40+R()*40,{curl:R()<.5,flowerEnd:R()<.4*dens,small:true});
   tw.delay=(k/v.ie)*.9+i*.12;tw.dur=.45;L.vines.push(tw)}}
 let lm=L.pts[0],rm=L.pts[0];for(const p of L.pts){if(p[0]<lm[0])lm=p;if(p[0]>rm[0])rm=p}
 L.sideL=makeVine(R,lm[0],lm[1]+10,Math.PI+(R()-.5)*.5,170+R()*60,{curl:true,flowerEnd:false});L.sideL.dur=1.1;
 L.sideR=makeVine(R,rm[0],rm[1]+10,(R()-.5)*.5,170+R()*60,{curl:true,flowerEnd:false});L.sideR.dur=1.1}

/* ---------- буквы и раскладка ---------- */
const mc=document.createElement('canvas').getContext('2d');
let letters=[],curText='',sceneSeed=12345,sceneStart=0,D=10,T=0,schedT0=0,FREEZE=null,FRAME=false,BFS=[];
const LIVE={G:3.4,bl:1.1};
let fr={x:W/2,y:H/2,w:10,h:10,tx:W/2,ty:H/2,tw:10,th:10,born:0,show:0};
function createLetter(ch,idx,dens){
 mc.font=fontStr();const w=mc.measureText(ch).width,pad=30,cw=Math.ceil(w)+pad*2,chh=340;
 const o=document.createElement('canvas');o.width=cw;o.height=chh;const g=o.getContext('2d');g.font=fontStr();g.fillStyle='#fff';g.fillText(ch,pad,250);
 const data=g.getImageData(0,0,cw,chh).data,pts=[];let top=1e9;
 for(let y=0;y<chh;y+=4)for(let x=0;x<cw;x+=4)if(data[(y*cw+x)*4+3]>140){pts.push([x-pad,y-250]);if(y-250<top)top=y-250}
 const L={ch,idx,w,pts,top,x:0,y:0,sc:1,tx:0,ty:0,tsc:1,fresh:true,few:dens>.8,born:T,...LIVE,first:false,last:false,la:0,ra:0};
 genVines(L,dens);return L}
const countNS=s=>s.replace(/\s/g,'').length;
function layout(){
 const s=curText,words=[];let m;const re=/\S+/g;while((m=re.exec(s)))words.push({t:m[0],i:m.index});
 if(!words.length)return;
 mc.font=fontStr();const sp=mc.measureText(' ').width,ww=w=>mc.measureText(w).width;let lines=[],f;
 for(f=270;f>=70;f-=10){const k=f/REF,maxw=1480/k;lines=[];let cur=null;
  for(const w of words){const wd=ww(w.t);if(cur&&cur.w+sp+wd<=maxw){cur.items.push([w,cur.w+sp]);cur.w+=sp+wd}else{cur={items:[[w,0]],w:wd};lines.push(cur)}}
  if(lines.every(l=>l.w<=maxw)&&lines.length*f*1.0<=580)break}
 f=Math.max(f,70);const k=f/REF,byIdx={};letters.forEach(L=>byIdx[L.idx]=L);letters.forEach(L=>{L.first=false;L.last=false});
 const lh=f*1.0;let minX=1e9,maxX=-1e9;
 lines.forEach((l,li)=>{const x0=W/2-l.w*k/2,y=H/2+(li-(lines.length-1)/2)*lh+f*.17;minX=Math.min(minX,x0);maxX=Math.max(maxX,x0+l.w*k);
  let firstL=null,lastL=null;
  for(const[w,off]of l.items)for(let j=0;j<w.t.length;j++){const L=byIdx[w.i+j];if(!L)continue;
   L.tx=x0+(off+mc.measureText(w.t.slice(0,j)).width)*k;L.ty=y;L.tsc=k;if(!firstL)firstL=L;lastL=L;
   if(L.fresh){L.x=L.tx;L.y=L.ty;L.sc=k;L.fresh=false}}
  if(firstL)firstL.first=true;if(lastL)lastL.last=true});
 const nl=lines.length,padd=70*k;
 fr.tx=(minX+maxX)/2;fr.tw=maxX-minX+padd*2;fr.th=nl*lh+f*.5;fr.ty=H/2+f*.17-f*.18;
 if(fr.w<20){fr.x=fr.tx;fr.y=fr.ty;fr.w=fr.tw;fr.h=fr.th}}
function setText(s){
 s=s.replace(/\s+/g,' ');const old=curText;let p=0;while(p<old.length&&p<s.length&&old[p]===s[p])p++;
 const hadAny=letters.length>0;letters=letters.filter(L=>L.idx<p);let k=0;const dens=clamp(9/Math.max(1,countNS(s)),.4,1);
 for(let i=p;i<s.length;i++)if(s[i]!==' '){const L=createLetter(s[i],i,dens);L.born=T+k*.1;k++;letters.push(L)}
 if(!hadAny&&letters.length){resetScene();fr.born=T}
 curText=s;layout();updateUI()}
function resetScene(){sceneStart=T;makeBF()}
function schedule(){
 const n=letters.length;if(!n)return;const sp=n>1?Math.min(.3,D*.22/(n-1)):0,G=clamp(D*.34,1.8,4.2),bl=clamp(D*.1,.7,1.2);
 letters.sort((a,b)=>a.idx-b.idx).forEach((L,i)=>{L.born=T+.3+i*sp;L.G=G;L.bl=bl});fr.born=T+.1;schedT0=T;resetScene()}
function regen(){
 sceneSeed=(Math.random()*1e9)|0;const dens=clamp(9/Math.max(1,countNS(curText)),.4,1);
 letters=letters.map(L=>{const N=createLetter(L.ch,L.idx,dens);N.x=L.x;N.y=L.y;N.sc=L.sc;N.tx=L.tx;N.ty=L.ty;N.tsc=L.tsc;N.fresh=false;N.first=L.first;N.last=L.last;N.la=L.la;N.ra=L.ra;return N});schedule()}
function rebuild(){const s=txt.value;letters=[];curText='';setText(s);regen()}

/* ---------- бабочки ---------- */
function makeBF(){const R=rng(sceneSeed^0x5bd1e995);BFS=[];
 for(let k=0;k<5;k++)BFS.push({born:sceneStart+D*.38+k*.55,ax:380+R()*260,bx:70+R()*80,ay:170+R()*80,by:40+R()*50,fx:.16+R()*.14,gx:.4+R()*.3,fy:.22+R()*.16,gy:.5+R()*.3,px:R()*TAU,qx:R()*TAU,py:R()*TAU,qy:R()*TAU,size:26+R()*14,fr:8+R()*4,ph:R()*TAU,ci:k,dir:R()<.5?1:-1})}
function bfPos(b,t){t*=b.dir;return[W/2+b.ax*Math.sin(b.fx*t+b.px)+b.bx*Math.sin(b.gx*t+b.qx),H/2+b.ay*Math.sin(b.fy*t+b.py)+b.by*Math.cos(b.gy*t+b.qy)]}
function wing(c,s,C,upper){
 c.beginPath();
 if(upper){c.moveTo(0,0);c.bezierCurveTo(s*.2,-s*1.15,s*1.35,-s*1.15,s*1.15,-s*.2);c.bezierCurveTo(s*1.0,s*.15,s*.4,s*.12,0,0)}
 else{c.moveTo(0,0);c.bezierCurveTo(s*.75,s*.02,s*.95,s*.85,s*.48,s*.85);c.bezierCurveTo(s*.15,s*.8,0,s*.4,0,0)}
 c.fillStyle=upper?C[0]:mix(C[0],C[1],.45);c.fill();c.strokeStyle=C[1];c.lineWidth=Math.max(1,s*.06);c.stroke();
 c.beginPath();c.arc(upper?s*.9:s*.5,upper?-s*.42:s*.6,s*.07,0,TAU);c.fillStyle=C[1];c.fill()}
function drawBF(c,b){
 const tt=T-b.born;if(tt<0)return;const app=ease(tt/1.2),t=tt+b.ph*3,p=bfPos(b,t),p2=bfPos(b,t+.03);
 const h=Math.atan2(p2[1]-p[1],p2[0]-p[0])+Math.PI/2,ca=Math.cos(h),sa=Math.sin(h),s=b.size*app,C=TH.bf[b.ci%TH.bf.length];
 const fl=.16+.84*Math.abs(Math.sin(T*b.fr+b.ph));
 for(const sd of[1,-1]){c.setTransform(ca*sd*fl,sa*sd*fl,-sa,ca,p[0],p[1]);wing(c,s*.85,C,false);wing(c,s,C,true)}
 c.setTransform(ca,sa,-sa,ca,p[0],p[1]);c.fillStyle=C[1];c.beginPath();c.ellipse(0,0,s*.08,s*.5,0,0,TAU);c.fill();
 c.strokeStyle=C[1];c.lineWidth=1.4;c.beginPath();c.moveTo(0,-s*.45);c.quadraticCurveTo(s*.1,-s*.8,s*.28,-s*.9);c.moveTo(0,-s*.45);c.quadraticCurveTo(-s*.1,-s*.8,-s*.28,-s*.9);c.stroke()}

/* ---------- отрисовка ---------- */
function drawGlyph(L){
 const age=T-L.born;if(age<0)return;const p=back(age/.45);
 ctx.setTransform(L.sc*p,0,0,L.sc*p,L.x+L.w*L.sc*(1-p)/2,L.y);
 ctx.globalAlpha=clamp(age/.2);ctx.font=fontStr();ctx.fillStyle=TH.letter;ctx.fillText(L.ch,0,0);ctx.globalAlpha=1}
function vineHead(L,v){const st=L.born+.15+v.delay*L.G,dur=v.dur*L.G;return clamp((T-st)/dur)}
function drawVine(L,v,h,alpha){
 const N=v.n,hd=h*(N-1);if(hd<=0)return;const last=Math.floor(hd),fr2=hd-last;
 ctx.setTransform(L.sc,0,0,L.sc,L.x,L.y);ctx.globalAlpha=alpha;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=TH.vine;
 let s=0;const CH=5;
 while(s<N-1){
  const e=Math.min(s+CH,last);
  ctx.beginPath();ctx.moveTo(v.xs[s],v.ys[s]);for(let i=s+1;i<=e;i++)ctx.lineTo(v.xs[i],v.ys[i]);
  if(e===last&&last<N-1&&fr2>0)ctx.lineTo(v.xs[last]+(v.xs[last+1]-v.xs[last])*fr2,v.ys[last]+(v.ys[last+1]-v.ys[last])*fr2);
  const mid=(s+e)/2;ctx.lineWidth=Math.max(1,v.w0*(1-.6*mid/(N-1)));ctx.stroke();
  if(e>=last)break;s=e}
 const dur=v.dur*L.G;
 for(const lf of v.leaves){if(lf.i>hd)continue;const age=(hd-lf.i)/(N-1)*dur,k=ease(age/.5);if(k<=0)continue;
  const a=lf.a+Math.sin(T*1.4+lf.ph)*.07,ca=Math.cos(a)*k,sa=Math.sin(a)*k;
  ctx.setTransform(L.sc*ca,L.sc*sa,-L.sc*sa,L.sc*ca,L.x+v.xs[lf.i]*L.sc,L.y+v.ys[lf.i]*L.sc);
  ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(lf.len*.5,-lf.len*.3,lf.len,0);ctx.quadraticCurveTo(lf.len*.5,lf.len*.3,0,0);
  ctx.fillStyle=lf.c?TH.vineLight:TH.vine;ctx.fill();
  ctx.strokeStyle=rgba(TH.vineLight,.5);ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(lf.len*.8,0);ctx.stroke()}
 ctx.globalAlpha=1}
function drawFlowers(L,v,h){
 const N=v.n,hd=h*(N-1),dur=v.dur*L.G;
 for(const f of v.flowers){if(f.i>hd)continue;const age=(hd-f.i)/(N-1)*dur,b=clamp(age/L.bl);if(b<=0)continue;
  const e=pickF(f),rot=f.rot+Math.sin(T*1.1+f.r*9)*.05,br=1+Math.sin(T*1.6+f.ph)*.02;
  const ca=Math.cos(rot)*L.sc*br,sa=Math.sin(rot)*L.sc*br;
  ctx.setTransform(ca,sa,-sa,ca,L.x+(v.xs[f.i]+f.dx)*L.sc,L.y+(v.ys[f.i]+f.dy)*L.sc);
  if(b<.3)bud(ctx,f.R,b/.3,e.c[0],TH.vine);else PAINT[e.k](ctx,f.R,back((b-.3)/.7),e.c,f)}}
function render(){
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.drawImage(bgC,0,0);
 if(FRAME&&letters.length){const a=clamp((T-fr.born)/.8);if(a>0){
  ctx.setTransform(1,0,0,1,0,0);ctx.strokeStyle=TH.frame||TH.letter;ctx.lineWidth=13;ctx.lineJoin='round';
  const x=fr.x-fr.w/2,y=fr.y-fr.h/2,r=34,per=2*(fr.w+fr.h);ctx.setLineDash([per*ease(a),per]);
  ctx.beginPath();ctx.roundRect(x,y,fr.w,fr.h,r);ctx.stroke();ctx.setLineDash([])}}
 const vis=letters.filter(L=>T-L.born>=0);
 for(const L of vis)drawGlyph(L);
 for(const L of vis){
  for(const v of L.vines)drawVine(L,v,vineHead(L,v),1);
  if(L.sideL&&L.la>.02)drawVine(L,L.sideL,vineHead(L,L.sideL),L.la);
  if(L.sideR&&L.ra>.02)drawVine(L,L.sideR,vineHead(L,L.sideR),L.ra)}
 for(const L of vis)for(const v of L.vines)drawFlowers(L,v,vineHead(L,v));
 for(const b of BFS)drawBF(ctx,b);
 ctx.setTransform(1,0,0,1,0,0)}

/* ---------- темы ---------- */
function setTheme(i){THI=i;TH=THEMES[i];paintBg(i);document.querySelectorAll('.chip').forEach((c,j)=>c.classList.toggle('on',j===i))}
const themesEl=$('themes');
THEMES.forEach((t,i)=>{const b=document.createElement('button');b.className='chip';b.type='button';const fc=t.flowers[0].c[0];
 b.innerHTML=`<div class="sw" style="background:${t.bg};color:${t.letter}">Аа<span class="d" style="background:${fc}"></span><span class="d2" style="background:${t.flowers[t.flowers.length-1].c[0]}"></span><span class="v" style="background:${t.vine}"></span></div><span>${t.name}</span>`;
 b.onclick=()=>{if(!recording)setTheme(i)};themesEl.appendChild(b)});

/* ---------- запись видео ---------- */
let recording=false,rec=null,recEnd=0,lastURL=null;
function pickMime(){if(!window.MediaRecorder)return null;for(const m of['video/mp4;codecs=avc1.640028','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'])try{if(MediaRecorder.isTypeSupported(m))return m}catch(e){}return''}
function startRecording(){
 if(recording||!letters.length)return;const mime=pickMime();
 if(mime===null||!cv.captureStream){msg('Этот браузер не умеет записывать видео. Открой страницу в Chrome.');return}
 let stream;try{stream=cv.captureStream(30)}catch(e){msg('Не удалось начать запись: '+e.message);return}
 const opts={videoBitsPerSecond:12e6};if(mime)opts.mimeType=mime;
 try{rec=new MediaRecorder(stream,opts)}catch(e){try{rec=new MediaRecorder(stream)}catch(e2){msg('Не удалось начать запись: '+e2.message);return}}
 const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const type=(rec.mimeType||mime||'video/webm').split(';')[0],ext=type.includes('mp4')?'mp4':'webm';
  const blob=new Blob(chunks,{type});if(lastURL)URL.revokeObjectURL(lastURL);lastURL=URL.createObjectURL(blob);
  const d=new Date(),pd=x=>String(x).padStart(2,'0'),name=`flower-letters-${d.getFullYear()}${pd(d.getMonth()+1)}${pd(d.getDate())}-${pd(d.getHours())}${pd(d.getMinutes())}${pd(d.getSeconds())}.${ext}`;
  const a=document.createElement('a');a.href=lastURL;a.download=name;document.body.appendChild(a);a.click();a.remove();
  msg(`Готово: ${ext.toUpperCase()}, 1920×1080, ${D} с, ${(blob.size/1048576).toFixed(1)} МБ. <a href="${lastURL}" download="${name}">Скачать ещё раз</a>`,true);
  recording=false;updateUI()};
 setTheme(THI);regen();recording=true;recEnd=T+D+.4;rec.start(500);updateUI();msg('Идёт запись. Не переключай вкладку, пока она не закончится.')}
function tickRec(){if(!recording)return;const left=Math.max(0,recEnd-T);$('dl').textContent='Запись… '+Math.ceil(left)+' с';if(left<=0&&rec.state==='recording'){rec.stop();$('dl').textContent='Сохраняю…'}}

/* ---------- интерфейс ---------- */
const txt=$('txt'),stage=$('stage');let touched=false;
function msg(s,html){const m=$('msg');if(html)m.innerHTML=s;else m.textContent=s}
function updateUI(){$('hint').style.opacity=(!touched||!curText.trim())&&!recording?1:0;$('badge').style.display=recording?'block':'none';
 ['again','clear','txt','frm'].forEach(id=>$(id).disabled=recording);document.querySelectorAll('.seg button,.chip').forEach(b=>b.disabled=recording);
 $('dl').disabled=recording||!letters.length;if(!recording)$('dl').textContent='Скачать видео'}
stage.addEventListener('click',()=>{if(!recording)txt.focus()});
txt.addEventListener('focus',()=>{if(!touched){touched=true;setTimeout(()=>txt.select(),0);updateUI()}});
txt.addEventListener('input',()=>{touched=true;setText(txt.value)});
txt.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();txt.blur()}});
document.addEventListener('keydown',e=>{if(recording||document.activeElement===txt||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key.length===1&&!(document.activeElement&&document.activeElement.tagName==='BUTTON'&&e.key===' '))txt.focus()});
$('dur').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||recording)return;D=+b.dataset.d;document.querySelectorAll('#dur button').forEach(x=>x.classList.toggle('on',x===b))});
$('wt').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||recording)return;WEIGHT=+b.dataset.w;document.querySelectorAll('#wt button').forEach(x=>x.classList.toggle('on',x===b));rebuild()});
$('frm').onclick=()=>{FRAME=!FRAME;$('frm').classList.toggle('on',FRAME)};
$('again').onclick=()=>{if(letters.length)regen()};
$('clear').onclick=()=>{txt.value='';letters=[];curText='';resetScene();updateUI();txt.focus()};
$('dl').onclick=startRecording;

let lastT=performance.now()/1000;
function frame(now){const t=now/1000,dt=Math.min(.05,t-lastT);lastT=t;T=FREEZE!==null?FREEZE:t;const k=1-Math.exp(-dt*9);
 for(const L of letters){L.x+=(L.tx-L.x)*k;L.y+=(L.ty-L.y)*k;L.sc+=(L.tsc-L.sc)*k;L.la+=((L.first?1:0)-L.la)*k;L.ra+=((L.last?1:0)-L.ra)*k}
 fr.x+=(fr.tx-fr.x)*k;fr.y+=(fr.ty-fr.y)*k;fr.w+=(fr.tw-fr.w)*k;fr.h+=(fr.th-fr.h)*k;
 render();tickRec();requestAnimationFrame(frame)}
function boot(){T=performance.now()/1000;setTheme(0);resetScene();txt.value='Цветы';setText('Цветы');regen();updateUI();requestAnimationFrame(frame)}
const fontsReady=document.fonts?Promise.all([document.fonts.load('900 200px PF','Жa'),document.fonts.load('500 200px PF','Жa')]):Promise.resolve();
Promise.race([fontsReady,new Promise(r=>setTimeout(r,2500))]).then(boot,boot);
window.__fl={setTheme,setText:s=>{txt.value=s;setText(s)},regen,rebuild,startRecording,at:dt=>{FREEZE=schedT0+dt},live:()=>{FREEZE=null},setWeight:w=>{WEIGHT=w;rebuild()},setFrame:v=>{FRAME=v},get T(){return T},get letters(){return letters}};
})();
</script>
</body>
